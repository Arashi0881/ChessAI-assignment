[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessai"
version = "0.1.0"
description = "Chess GUI and tools for comparing alpha-beta and MCTS engines"
requires-python = ">=3.11"
dependencies = ["chess>=1.11"]

[dependency-groups]
dev = ["pytest>=8"]
data = ["zstandard>=0.22"]   # only for scripts/build_puzzles.py

[tool.setuptools.packages.find]
include = ["chessai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
